# Orlent Medical API (Cloudflare Workers). Deploy: Cloudflare Dashboard → Workers → GitHub repo ulash (Root directory: worker)
name = "orlent-medical-api"
main = "src/index.mjs"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# Domen: Worker saytni va API ni shu domenda beradi
routes = [
  { pattern = "orlentmedical.uz", custom_domain = true },
  { pattern = "www.orlentmedical.uz", custom_domain = true }
]

[build]
command = "node scripts/prep.mjs"

# Sayt fayllari (statik) — /api/* dan boshqa hamma narsa shu yerdan beriladi
[assets]
directory = "./public"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[vars]
# Saytning ochiq manzili (GitHub Pages yoki o'z domeningiz). Bot rasmlari va panel havolasi shu yerdan olinadi.
SITE_URL = "https://orlent-medical-api.chempme.workers.dev"
# Formaga/panelga so'rov yuborishi mumkin bo'lgan saytlar (vergul bilan)
ALLOWED_ORIGINS = "https://orlentmedical.uz,https://www.orlentmedical.uz,https://orlent-medical-api.chempme.workers.dev"

# Baza (D1). `wrangler d1 create orlent-bot` yoki Dashboard'da yaratib, database_id ni yozing
[[d1_databases]]
binding = "DB"
database_name = "orlent-bot"
database_id = "97ee429b-2b66-4323-bc66-e16e624fa864"

[triggers]
crons = ["0 15 * * *", "* * * * *"]
