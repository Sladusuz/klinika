# Orlent Medical API (Cloudflare Workers). Deploy: Cloudflare Dashboard → Workers → GitHub repo ulash (Root directory: worker)
name = "orlent-medical-api"
main = "src/index.mjs"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Saytning ochiq manzili (GitHub Pages yoki o'z domeningiz). Bot rasmlari va panel havolasi shu yerdan olinadi.
SITE_URL = "https://orlentmedi.netlify.app"
# Formaga/panelga so'rov yuborishi mumkin bo'lgan saytlar (vergul bilan)
ALLOWED_ORIGINS = "https://orlentmedi.netlify.app,https://sladusuz.github.io"

# Baza (D1). `wrangler d1 create orlent-bot` yoki Dashboard'da yaratib, database_id ni yozing
[[d1_databases]]
binding = "DB"
database_name = "orlent-bot"
database_id = "97ee429b-2b66-4323-bc66-e16e624fa864"

[triggers]
crons = ["0 15 * * *", "* * * * *"]
