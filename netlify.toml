# Netlify: build kerak emas, sayt oddiy statik fayllardan iborat
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# CSS/JS har doim yangilanadi (Netlify standarti), faqat rasmlar bir kun keshlanadi
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# /api/* — Cloudflare Worker bilan bir xil manzillar (Netlify'da o'tish davrida ishlashi uchun)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Sayt boshqa saytlar ichida ochilmasin (clickjacking himoyasi)
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'"

# Admin panel (Telegram Mini App) faqat Telegram ichida ochilishi mumkin
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors https://web.telegram.org https://webk.telegram.org https://webz.telegram.org https://*.telegram.org"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
